# Dev overlay for the backend: AUTO-RELOAD via Spring Boot DevTools.
# Runs `mvn spring-boot:run` inside a Maven image (source + ~/.m2 mounted); a
# watcher script recompiles on save and DevTools restarts the app automatically.
# No image rebuild needed.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d backend
#   scripts/dev-backend.sh          # <- recommended wrapper

services:
  backend:
    image: maven:3.9-eclipse-temurin-17
    build: !reset null
    command: ["bash", "/root/backend-watcher.sh"]
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: "2000"
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: "1500"
    volumes: !override
      - ./springboot-app:/build
      - ~/.m2:/root/.m2
      - ./scripts/backend-watcher.sh:/root/backend-watcher.sh:ro
      - uploads:/build/uploads

  # Dev frontend: runs `next dev` (HMR) with the source mounted so edits
  # hot-reload without rebuilding the image. node_modules lives in a named
  # volume and is installed on first start / when deps change.
  frontend:
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/next ]; then npm install --legacy-peer-deps; fi && npm run dev -- -p 3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes: !override
      - ./frontend-app:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
